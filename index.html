<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أذكار الصباح والمساء</title>
<meta name="description" content="أذكار الصباح والمساء والنوم مع عداد لكل ذكر، ومواعيد الصلاة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef4ee; --bg2:#dfeadf;
  --card:#fbfdfb; --card-done:#eaf2ea;
  --ink:#24372d; --muted:#5f7568;
  --accent:#3f6b55; --accent-soft:#cfe0d3; --accent-ink:#ffffff;
  --line:#d3e0d5; --gold:#b08d3c; --warn:#8a5a1f;
  --shadow:0 2px 10px rgba(40,70,55,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#14211b; --bg2:#101a15;
    --card:#1b2c24; --card-done:#18261f;
    --ink:#e3eee6; --muted:#93aa9b;
    --accent:#6fa889; --accent-soft:#2a4036; --accent-ink:#0f1a14;
    --line:#2b4237; --gold:#d3b160; --warn:#e0b878;
    --shadow:0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg1:#14211b; --bg2:#101a15;
  --card:#1b2c24; --card-done:#18261f;
  --ink:#e3eee6; --muted:#93aa9b;
  --accent:#6fa889; --accent-soft:#2a4036; --accent-ink:#0f1a14;
  --line:#2b4237; --gold:#d3b160; --warn:#e0b878;
  --shadow:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0}
body{
  font-family:"Cairo",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;
  min-height:100vh;
  line-height:1.7;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:28px 0 14px}
header h1{font-family:"Amiri",serif;font-size:2rem;margin:0;color:var(--accent);font-weight:700}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.bar{
  position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,var(--bg1) 80%,transparent);
  padding:10px 0 12px;
}
.tabs{display:flex;gap:4px;background:var(--accent-soft);padding:5px;border-radius:14px}
.tab{
  flex:1;border:0;background:transparent;color:var(--ink);
  font:600 .92rem "Cairo",sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer;
  transition:background .2s,color .2s;
}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.progress{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.track{flex:1;height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.time-note{
  margin:6px 0 14px;padding:10px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:.88rem;
}
.done-banner{
  display:none;margin:0 0 14px;padding:14px;text-align:center;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-family:"Amiri",serif;font-size:1.35rem;
}
.done-banner.show{display:block}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:background .25s,opacity .25s;
}
.card.done{background:var(--card-done);opacity:.72}
.pre{font-size:.85rem;color:var(--gold);margin:0 0 6px;font-weight:600}
.zikr{
  font-family:"Amiri","Scheherazade New",serif;
  font-size:1.5rem;line-height:2.2;margin:0;text-align:center;
}
.note{margin:8px 0 0;font-size:.82rem;color:var(--muted);text-align:center}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
}
.times{font-size:.9rem;color:var(--muted);font-weight:600}
.btns{display:flex;align-items:center;gap:10px}
.count{
  width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);
  font:700 1.5rem "Cairo",sans-serif;
  box-shadow:0 3px 0 rgba(0,0,0,.15);
  transition:transform .08s;
}
.count:active{transform:scale(.94)}
.count[disabled]{cursor:default;background:var(--accent-soft);color:var(--accent);box-shadow:none}
.reset{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;
  visibility:hidden;
}
.card.started .reset{visibility:visible}
.tools{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.tools button,.p-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:600 .9rem "Cairo",sans-serif;padding:9px 16px;border-radius:12px;cursor:pointer;
}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}

/* ---- مواعيد الصلاة ---- */
.p-loc{display:flex;gap:8px;margin-bottom:12px}
.p-loc select{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:600 .95rem "Cairo",sans-serif;padding:9px 10px;border-radius:12px;
}
.p-dates{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.p-dates div:first-child{color:var(--ink);font-weight:600}
.p-next{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;margin-bottom:12px;
}
.p-next .lbl{font-size:.85rem;opacity:.85}
.p-next strong{font-family:"Amiri",serif;font-size:1.8rem;line-height:1.4}
.p-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.p-row:last-child{border-bottom:0}
.p-row .n{font-family:"Amiri",serif;font-size:1.3rem}
.p-row .t{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.p-row.sun .n,.p-row.sun .t{color:var(--muted);font-weight:400}
.p-row.next{background:var(--accent-soft)}
.p-status{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0 8px;min-height:1.4em}
.p-status.warn{color:var(--warn)}
.p-actions{display:flex;justify-content:center}
.p-note{text-align:center;color:var(--muted);font-size:.78rem;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>أذكار الصباح والمساء</h1>
    <p>اضغط على الدائرة لتعدّ كل ذكر</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="morning" aria-selected="true">الصباح</button>
      <button class="tab" role="tab" data-tab="evening" aria-selected="false">المساء</button>
      <button class="tab" role="tab" data-tab="sleep" aria-selected="false">النوم</button>
      <button class="tab" role="tab" data-tab="prayer" aria-selected="false">الصلاة</button>
    </div>
    <div class="progress" id="progress">
      <span id="progress-text"></span>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>

  <div class="time-note" id="time-note"></div>
  <div class="done-banner" id="banner">تقبّل الله منك، أتممتَ الأذكار</div>

  <main id="list"></main>

  <section id="prayer" hidden>
    <div class="p-loc">
      <select id="city" aria-label="اختر المدينة"></select>
      <button class="p-btn" id="locate" type="button">موقعي الحالي</button>
    </div>
    <div class="p-dates"><div id="p-greg"></div><div id="p-hijri"></div></div>
    <div class="p-next" id="p-next" hidden>
      <span class="lbl">الصلاة القادمة</span>
      <strong id="p-next-name"></strong>
      <span id="p-next-left"></span>
    </div>
    <div class="p-list" id="p-list"></div>
    <p class="p-status" id="p-status"></p>
    <div class="p-actions"><button class="p-btn" id="p-refresh" type="button">تحديث المواعيد</button></div>
    <p class="p-note">المواعيد من خدمة AlAdhan، وبتتحسب بطريقة الهيئة المصرية العامة للمساحة. قارنها بمسجدك أو تقويم بلدك.</p>
  </section>

  <div class="tools" id="tools">
    <button id="reset-all" type="button">إعادة العدّ من البداية</button>
    <button id="auto-btn" type="button"></button>
    <button id="theme" type="button">تبديل الوضع الليلي</button>
  </div>

  <footer>
    نصوص الأذكار من رسالة «أذكار الصباح والمساء» للشيخ خالد بن عبد الله العتيبي
  </footer>
</div>

<script>
(function(){
  // ---------- نصوص مشتركة ----------
  var KUR = 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾ [البقرة: ٢٥٥]';
  var IKH = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿٤﴾ [الإخلاص: ١-٤]';
  var FAL = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِنْ شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾ [الفلق: ١-٥]';
  var NAS = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾ [الناس: ١-٦]';
  var FATIR = 'اللَّهُمَّ؛ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَشَرِّ الشَّيْطَانِ وَشِرْكِهِ.';
  var FATIR_NOTE = 'وله أن يقول بعد «وشركه»: «وأن أقترف على نفسي سوءًا، أو أجره إلى مسلم»';

  // ---------- أذكار الصباح والمساء ----------
  function build(v){
    var items = [];
    items.push({pre:'أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', t:KUR, n:1});
    items.push({t:IKH, n:3});
    items.push({t:FAL, n:3});
    items.push({t:NAS, n:3});
    items.push({t:'لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.', n:1, note:'يجوز أيضًا أن تُقال عشر مرات، أو مائة مرة'});
    items.push({t:'سُبْحَانَ اللهِ وَبِحَمْدِهِ.', n:100});
    items.push({t:'بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.', n:3});
    if(v.evening){
      items.push({t:'أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.', n:3});
    }
    items.push({t:'رَضِيتُ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا وَرَسُولًا.', n:3});
    items.push({t:'حَسْبِيَ اللهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.', n:7});
    items.push({t: v.a1 + ' عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ.', n:1});
    items.push({t: v.a1 + ' وَ' + v.a2 + ' الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ؛ أَسْأَلُكَ خَيْرَ مَا فِي ' + v.now + ' وَخَيْرَ مَا بَعْدَ' + v.after + '، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي ' + v.now + ' وَشَرِّ مَا بَعْدَ' + v.after + '، رَبِّ؛ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ؛ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.', n:1});
    items.push({t:'اللَّهُمَّ؛ بِكَ ' + v.b1 + '، وَبِكَ ' + v.b2 + '، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ ' + v.end + '.', n:1});
    items.push({t:'اللَّهُمَّ؛ إِنِّي ' + v.c + ' أُشْهِدُكَ وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.', n:4});
    items.push({t:'اللَّهُمَّ؛ مَا ' + v.d + ' بِي مِنْ نِعْمَةٍ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، لَكَ الْحَمْدُ، وَلَكَ الشُّكْرُ.', n:1});
    items.push({t:'يَا حَيُّ يَا قَيُّومُ؛ بِكَ أَسْتَغِيثُ، فَأَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.', n:1});
    items.push({t:'اللَّهُمَّ؛ عَافِنِي فِي بَدَنِي، اللَّهُمَّ؛ عَافِنِي فِي سَمْعِي، اللَّهُمَّ؛ عَافِنِي فِي بَصَرِي، اللَّهُمَّ؛ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ؛ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.', n:3});
    items.push({t:'اللَّهُمَّ؛ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ؛ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ؛ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ؛ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.', n:1});
    items.push({t:FATIR, n:1, note:FATIR_NOTE});
    if(v.morning){

  // ---------- أذكار النوم ----------

    items.push({t:'اللَّهُمَّ؛ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.', n:3});
    items.push({t:FATIR, n:1, note:FATIR_NOTE});

  var DATA = {
    morning: {
      note: 'وقت أذكار الصباح: من بعد صلاة الفجر إلى طلوع الشمس.',
      items: build({morning:true, a1:'أَصْبَحْنَا', a2:'أَصْبَحَ', b1:'أَصْبَحْنَا', b2:'أَمْسَيْنَا', end:'النُّشُورُ', c:'أَصْبَحْتُ', d:'أَصْبَحَ', now:'هَذَا الْيَوْمِ', after:'هُ'})
    },
    evening: {
      note: 'وقت أذكار المساء: من بعد صلاة العصر إلى غروب الشمس.',
      items: build({evening:true, a1:'أَمْسَيْنَا', a2:'أَمْسَى', b1:'أَمْسَيْنَا', b2:'أَصْبَحْنَا', end:'الْمَصِيرُ', c:'أَمْسَيْتُ', d:'أَمْسَى', now:'هَذِهِ اللَّيْلَةِ', after:'هَا'})
    },
    sleep: {
      note: 'أذكار النوم: عند إرادة النوم.',
      items: buildSleep()
    }
  };

  // ---------- الحالة ----------
  var KEY = 'adhkar-state-v1';
  function today(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }
  var state = {date: today(), morning:{}, evening:{}, sleep:{}};
  try{
    var s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.date === today()){
      state = s;
      state.morning = state.morning || {};
      state.evening = state.evening || {};
      state.sleep = state.sleep || {};
    }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var auto = true;
  try{ if(localStorage.getItem('adhkar-auto') === 'off'){ auto = false; } }catch(e){}

  var TABS = ['morning','evening','sleep','prayer'];
  var current = (new Date().getHours() < 12) ? 'morning' : 'evening';
  try{
    var saved = sessionStorage.getItem('adhkar-tab');
    if(TABS.indexOf(saved) !== -1){ current = saved; }
  }catch(e){}

  // ---------- أدوات ----------
  function ar(n){ return Number(n).toLocaleString('ar-EG'); }
  function digits(s){ return String(s).replace(/\d/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.charAt(d); }); }
  function times(n){
    if(n === 1) return 'مرة واحدة';
    if(n === 2) return 'مرتان';
    if(n <= 10) return ar(n) + ' مرات';
    return ar(n) + ' مرة';
  }
  function remaining(tab, it){
    var r = state[tab][it.id];
    return (r === undefined) ? it.n : r;
  }
  function reduceMotion(){
    try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
  }

  var list = document.getElementById('list');
  var fill = document.getElementById('fill');
  var ptext = document.getElementById('progress-text');
  var banner = document.getElementById('banner');
  var tnote = document.getElementById('time-note');
  var progressEl = document.getElementById('progress');
  var prayerEl = document.getElementById('prayer');
  var resetBtn = document.getElementById('reset-all');
  var autoBtn = document.getElementById('auto-btn');
  var cards = [];

  function updateProgress(){
    var items = DATA[current].items;
    var done = 0;
    items.forEach(function(it){ if(remaining(current, it) === 0) done++; });
    ptext.textContent = 'تم ' + ar(done) + ' من ' + ar(items.length);
    fill.style.width = (done / items.length * 100) + '%';
    banner.classList.toggle('show', done === items.length);
  }

  function paintCard(card, it){
    var r = remaining(current, it);
    var btn = card.querySelector('.count');
    card.classList.toggle('done', r === 0);
    card.classList.toggle('started', r !== it.n);
    btn.disabled = (r === 0);
    btn.textContent = (r === 0) ? '✓' : ar(r);
    btn.setAttribute('aria-label', r === 0 ? 'تم' : 'المتبقي ' + r);
  }

  // الانتقال التلقائي للذكر التالي
  var advTimer = null;
  function scheduleAdvance(fromIdx){
    if(!auto) return;
    var tab = current;
    clearTimeout(advTimer);
    advTimer = setTimeout(function(){
      if(current !== tab) return;
      var items = DATA[tab].items, n = items.length, target = -1;
      for(var k = 1; k <= n; k++){
        var j = (fromIdx + k) % n;
        if(remaining(tab, items[j]) > 0){ target = j; break; }
      }
      var el = (target >= 0) ? cards[target] : banner;
      if(el && el.scrollIntoView){
        el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center'});
      }
    }, 450);
  }

  function render(){
    list.innerHTML = '';
    cards = [];
    tnote.textContent = DATA[current].note;
    DATA[current].items.forEach(function(it){
      var card = document.createElement('article');
      card.className = 'card';
      var html = '';
      if(it.pre){ html += '<p class="pre">' + it.pre + '</p>'; }
      html += '<p class="zikr">' + it.t + '</p>';
      if(it.note){ html += '<p class="note">' + it.note + '</p>'; }
      html += '<div class="foot"><span class="times">' + times(it.n) + '</span>' +
              '<div class="btns"><button class="reset" title="إعادة هذا الذكر" aria-label="إعادة هذا الذكر">↺</button>' +
              '<button class="count"></button></div></div>';
      card.innerHTML = html;

      card.querySelector('.count').addEventListener('click', function(){
        var r = remaining(current, it);
        if(r <= 0) return;
        state[current][it.id] = r - 1;
        save();
        paintCard(card, it);
        updateProgress();
        if(r - 1 === 0){
          if(navigator.vibrate){ try{ navigator.vibrate(40); }catch(e){} }
          scheduleAdvance(it.id);
        }
      });
      card.querySelector('.reset').addEventListener('click', function(){
        delete state[current][it.id];
        save();
        paintCard(card, it);
        updateProgress();
      });

      paintCard(card, it);
      list.appendChild(card);
      cards.push(card);
    });
    updateProgress();
  }

  // ---------- مواعيد الصلاة ----------
  var CITIES = [
    ['الإسكندرية',31.2001,29.9187],['القاهرة',30.0444,31.2357],['الجيزة',30.0131,31.2089],
    ['بنها',30.4660,31.1848],['طنطا',30.7865,31.0004],['المنصورة',31.0409,31.3785],
    ['الزقازيق',30.5877,31.5020],['دمنهور',31.0341,30.4682],['كفر الشيخ',31.1107,30.9388],
    ['شبين الكوم',30.5586,31.0092],['دمياط',31.4165,31.8133],['بورسعيد',31.2653,32.3019],
    ['الإسماعيلية',30.5965,32.2715],['السويس',29.9668,32.5498],['الفيوم',29.3084,30.8428],
    ['بني سويف',29.0661,31.0994],['المنيا',28.1099,30.7503],['أسيوط',27.1783,31.1859],
    ['سوهاج',26.5591,31.6948],['قنا',26.1551,32.7160],['الأقصر',25.6872,32.6396],
    ['أسوان',24.0889,32.8998],['الغردقة',27.2579,33.8116],['شرم الشيخ',27.9158,34.3300],
    ['مرسى مطروح',31.3543,27.2373],['العريش',31.1316,33.7984]
  ];
  var PRAYERS = [['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
  var NEXT_ORDER = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  var PKEY = 'adhkar-prayer-v1';

  var pstate = {sel:'0', geo:null, cache:null};
  try{
    var ps = JSON.parse(localStorage.getItem(PKEY));
    if(ps && typeof ps === 'object'){
      if(ps.sel !== undefined){ pstate.sel = String(ps.sel); }
      pstate.geo = ps.geo || null;
      pstate.cache = ps.cache || null;
    }
  }catch(e){}
  if(pstate.sel === 'geo' && !pstate.geo){ pstate.sel = '0'; }
  if(pstate.sel !== 'geo' && !CITIES[Number(pstate.sel)]){ pstate.sel = '0'; }
  function savePrayer(){ try{ localStorage.setItem(PKEY, JSON.stringify(pstate)); }catch(e){} }

  var citySel = document.getElementById('city');
  var locateBtn = document.getElementById('locate');
  var refreshBtn = document.getElementById('p-refresh');
  var pList = document.getElementById('p-list');
  var pStatus = document.getElementById('p-status');
  var pGreg = document.getElementById('p-greg');
  var pHijri = document.getElementById('p-hijri');
  var pNext = document.getElementById('p-next');
  var pNextName = document.getElementById('p-next-name');
  var pNextLeft = document.getElementById('p-next-left');
  var rows = {};
  var reqId = 0;
  var pTimer = null;

  CITIES.forEach(function(c, i){
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = c[0];
    citySel.appendChild(o);
  });
  function ensureGeoOption(){
    if(citySel.querySelector('option[value="geo"]')) return;
    var o = document.createElement('option');
    o.value = 'geo';
    o.textContent = 'موقعي الحالي';
    citySel.insertBefore(o, citySel.firstChild);
  }
  if(pstate.geo){ ensureGeoOption(); }

  PRAYERS.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'p-row' + (p[0] === 'Sunrise' ? ' sun' : '');
    var n = document.createElement('span'); n.className = 'n'; n.textContent = p[1];
    var t = document.createElement('span'); t.className = 't'; t.textContent = '--:--';
    row.appendChild(n); row.appendChild(t);
    pList.appendChild(row);
    rows[p[0]] = {row: row, t: t};
  });

  function coords(){
    if(pstate.sel === 'geo' && pstate.geo){ return {lat: pstate.geo.lat, lng: pstate.geo.lng}; }
    var c = CITIES[Number(pstate.sel)];
    return {lat: c[1], lng: c[2]};
  }
  // داخل مصر: طريقة الهيئة المصرية العامة للمساحة (رقم 5). خارجها: نسيب الخدمة تختار حسب الموقع
  function methodFor(p){
    return (p.lat >= 21.5 && p.lat <= 31.8 && p.lng >= 24.5 && p.lng <= 36.9) ? 5 : null;
  }
  function locKey(){
    var g = (pstate.sel === 'geo' && pstate.geo) ? pstate.geo.lat.toFixed(2) + ',' + pstate.geo.lng.toFixed(2) : '';
    return pstate.sel + '|' + g;
  }
  function cacheKey(){ return locKey() + '|' + new Date().toDateString(); }
  function sameLoc(c){
    return !!(c && c.key && c.key.split('|').slice(0, 2).join('|') === locKey());
  }

  function setStatus(msg, warn){
    pStatus.textContent = msg;
    pStatus.className = 'p-status' + (warn ? ' warn' : '');
  }
  function fmt(s){
    var p = s.split(':');
    var h = Number(p[0]);
    var ap = h >= 12 ? 'م' : 'ص';
    return digits(h % 12 || 12) + ':' + digits(p[1]) + ' ' + ap;
  }
  function toMin(s){
    var p = s.split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function nowIn(tz){
    try{
      var parts = new Intl.DateTimeFormat('en-GB', {timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).formatToParts(new Date());
      var h = 0, m = 0;
      parts.forEach(function(p){
        if(p.type === 'hour'){ h = Number(p.value); }
        if(p.type === 'minute'){ m = Number(p.value); }
      });
      return h * 60 + m;
    }catch(e){
      var d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    }
  }
  function leftText(mins){
    var h = Math.floor(mins / 60), m = mins % 60;
    if(h > 0 && m > 0){ return 'بعد ' + digits(h) + ' ساعة و' + digits(m) + ' دقيقة'; }
    if(h > 0){ return 'بعد ' + digits(h) + ' ساعة'; }
    return 'بعد ' + digits(m) + ' دقيقة';
  }
  function timeOfDay(at){
    try{ return new Date(at).toLocaleTimeString('ar-EG', {hour: 'numeric', minute: '2-digit'}); }catch(e){ return ''; }
  }

  function clearRows(){
    PRAYERS.forEach(function(p){
      rows[p[0]].t.textContent = '--:--';
      rows[p[0]].row.classList.remove('next');
    });
    pNext.hidden = true;
    pGreg.textContent = '';
    pHijri.textContent = '';
  }

  function updateNext(){
    var c = pstate.cache;
    if(!c || !c.timings || !sameLoc(c)){ pNext.hidden = true; return; }
    var now = nowIn(c.tz || 'Africa/Cairo');
    var nextKey = null, diff = 0, tomorrow = false;
    for(var i = 0; i < NEXT_ORDER.length; i++){
      var m = toMin(c.timings[NEXT_ORDER[i]]);
      if(m > now){ nextKey = NEXT_ORDER[i]; diff = m - now; break; }
    }
    if(!nextKey){
      nextKey = 'Fajr';
      diff = (1440 - now) + toMin(c.timings.Fajr);
      tomorrow = true;
    }
    PRAYERS.forEach(function(p){ rows[p[0]].row.classList.toggle('next', p[0] === nextKey); });
    var label = '';
    PRAYERS.forEach(function(p){ if(p[0] === nextKey){ label = p[1]; } });
    pNextName.textContent = label + (tomorrow ? ' (غدًا)' : '');
    pNextLeft.textContent = leftText(diff);
    pNext.hidden = false;
  }

  function renderPrayer(){
    var c = pstate.cache;
    if(!c || !c.timings || !sameLoc(c)){ clearRows(); return; }
    PRAYERS.forEach(function(p){ rows[p[0]].t.textContent = fmt(c.timings[p[0]]); });
    var g = '';
    try{
      g = new Date().toLocaleDateString('ar-EG', {timeZone: c.tz || 'Africa/Cairo', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
    }catch(e){}
    pGreg.textContent = g;
    var h = c.hijri;
    pHijri.textContent = h ? (digits(h.d) + ' ' + h.m + ' ' + digits(h.y) + ' هـ') : '';
    updateNext();
  }

  function fetchTimes(lat, lng, method){
    var url = 'https://api.aladhan.com/v1/timings/' + Math.floor(Date.now() / 1000) +
              '?latitude=' + lat + '&longitude=' + lng + (method ? '&method=' + method : '');
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = setTimeout(function(){ if(ctl){ ctl.abort(); } }, 12000);
    return fetch(url, ctl ? {signal: ctl.signal} : {}).then(function(r){
      clearTimeout(to);
      if(!r.ok){ throw new Error('http'); }
      return r.json();
    }, function(err){ clearTimeout(to); throw err; });
  }

  function loadPrayer(force){
    var my = ++reqId;
    var c = pstate.cache;
    var key = cacheKey();
    if(!force && c && c.key === key && c.timings){
      renderPrayer();
      setStatus('آخر تحديث: ' + timeOfDay(c.at));
      return;
    }
    setStatus('بجيب المواعيد...');
    var p = coords();
    fetchTimes(p.lat, p.lng, methodFor(p)).then(function(j){
      if(my !== reqId){ return; }
      var d = j && j.data;
      if(!d || !d.timings){ throw new Error('bad'); }
      var t = {};
      PRAYERS.forEach(function(x){
        var v = String(d.timings[x[0]] || '').split(' ')[0];
        if(!/^\d{1,2}:\d{2}$/.test(v)){ throw new Error('bad'); }
        t[x[0]] = v;
      });
      var h = d.date && d.date.hijri;
      pstate.cache = {
        key: key,
        timings: t,
        tz: (d.meta && d.meta.timezone) || 'Africa/Cairo',
        hijri: h ? {d: h.day, m: h.month && h.month.ar, y: h.year} : null,
        at: Date.now()
      };
      savePrayer();
      renderPrayer();
      setStatus('آخر تحديث: ' + timeOfDay(pstate.cache.at));
    }).catch(function(){
      if(my !== reqId){ return; }
      if(pstate.cache && pstate.cache.timings && sameLoc(pstate.cache)){
        renderPrayer();
        setStatus('تعذر التحديث دلوقتي، معروض آخر مواعيد محفوظة.', true);
      }else{
        clearRows();
        setStatus('مقدرتش أجيب المواعيد. اتأكد من النت واضغط «تحديث المواعيد».', true);
      }
    });
  }

  function startPrayer(){
    citySel.value = pstate.sel;
    renderPrayer();
    loadPrayer(false);
    clearInterval(pTimer);
    pTimer = setInterval(updateNext, 30000);
  }
  function stopPrayer(){ clearInterval(pTimer); pTimer = null; }

  citySel.addEventListener('change', function(){
    pstate.sel = citySel.value;
    savePrayer();
    clearRows();
    loadPrayer(true);
  });
  refreshBtn.addEventListener('click', function(){ loadPrayer(true); });
  locateBtn.addEventListener('click', function(){
    if(!navigator.geolocation){
      setStatus('المتصفح مش بيدعم تحديد الموقع. اختار مدينتك من القائمة.', true);
      return;
    }
    setStatus('بحدد موقعك...');
    navigator.geolocation.getCurrentPosition(function(pos){
      pstate.geo = {
        lat: Math.round(pos.coords.latitude * 10000) / 10000,
        lng: Math.round(pos.coords.longitude * 10000) / 10000
      };
      pstate.sel = 'geo';
      ensureGeoOption();
      citySel.value = 'geo';
      savePrayer();
      clearRows();
      loadPrayer(true);
    }, function(){
      setStatus('مقدرتش أحدد موقعك. اختار مدينتك من القائمة.', true);
    }, {timeout: 10000, maximumAge: 600000});
  });

  // ---------- التبويبات والأدوات ----------
  function setTab(name){
    current = name;
    clearTimeout(advTimer);
    try{ sessionStorage.setItem('adhkar-tab', name); }catch(e){}
    document.querySelectorAll('.tab').forEach(function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === name ? 'true' : 'false');
    });
    var isP = (name === 'prayer');
    list.hidden = isP;
    prayerEl.hidden = !isP;
    progressEl.hidden = isP;
    tnote.hidden = isP;
    resetBtn.hidden = isP;
    if(isP){
      banner.classList.remove('show');
      startPrayer();
    }else{
      stopPrayer();
      render();
    }
    window.scrollTo({top: 0});
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); });
  });

  resetBtn.addEventListener('click', function(){
    if(!confirm('تبدأ العدّ من الأول لأذكار هذا التبويب؟')) return;
    state[current] = {};
    save();
    render();
  });

  function paintAuto(){
    autoBtn.textContent = 'الانتقال التلقائي: ' + (auto ? 'مفعّل' : 'متوقف');
  }
  autoBtn.addEventListener('click', function(){
    auto = !auto;
    try{ localStorage.setItem('adhkar-auto', auto ? 'on' : 'off'); }catch(e){}
    paintAuto();
  });
  paintAuto();

  // الوضع الليلي
  var themeBtn = document.getElementById('theme');
  try{
    var th = localStorage.getItem('adhkar-theme');
    if(th){ document.documentElement.setAttribute('data-theme', th); }
  }catch(e){}
  themeBtn.addEventListener('click', function(){
    var root = document.documentElement;
    var isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('adhkar-theme', next); }catch(e){}
  });

  setTab(current);
})();
</script>
</body>
</html>
